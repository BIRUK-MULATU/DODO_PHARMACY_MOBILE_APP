name: dodomed_admin
description: "DODOMED Admin — the staff-only app for managing tracks, packs, questions, payments, users and Q&A (see ../user_app for the learner-facing app)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pdfx: ^2.11.0
  path_provider: ^2.1.6
  no_screenshot: ^1.2.0
  file_selector: ^1.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  dodomed_core:
    path: ../../packages/dodomed_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  file_selector_platform_interface: ^2.7.0
  cross_file: ^0.3.5+5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
